<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidayat Teknik | Admin Dasbor</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 120px auto 50px;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .admin-header h2 {
            color: var(--primary-color);
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }
        .admin-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .admin-btn:hover {
            background: var(--primary-hover);
        }
        #image-preview {
            max-width: 200px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none; display:flex; align-items:center; gap:0.5rem;"><img src="assets/images/logo.png" alt="Hidayat Teknik" style="height: 40px; width: auto; object-fit: contain; vertical-align: middle;"> <span style="font-weight:700; letter-spacing:1px; font-size:1.2rem;">Hidayat Teknik.</span></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="katalog.html">Katalog</a></li>
            </ul>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h2><i class="fa-solid fa-lock"></i> Tambah Produk Baru</h2>
            <p>Masukkan produk ke database Supabase secara live.</p>
        </div>

        <form id="add-product-form">
            <div class="form-group">
                <label>Nama Produk</label>
                <input type="text" id="p-title" required placeholder="Contoh: Terali Jendela Minimalis">
            </div>

            <div class="form-group">
                <label>Harga (Rupiah)</label>
                <input type="number" id="p-price" required placeholder="Contoh: 1500000">
            </div>

            <div class="form-group">
                <label>Kategori</label>
                <select id="p-category" required>
                    <option value="jendela">Jendela</option>
                    <option value="pintu">Pintu Utama</option>
                    <option value="klasik">Klasik</option>
                    <option value="modern">Modern / Balkon</option>
                </select>
            </div>

            <div class="form-group">
                <label>Foto Produk (Maks 5MB)</label>
                <input type="file" id="p-image" accept="image/*" required>
                <img id="image-preview" src="" alt="Preview">
            </div>

            <button type="submit" class="admin-btn"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Produk</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>
</body>
</html>
