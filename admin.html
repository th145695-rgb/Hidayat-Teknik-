<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidayat Teknik | Admin Dasbor</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 120px auto 50px;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .admin-header h2 {
            color: var(--primary-color);
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }
        .admin-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .admin-btn:hover {
            background: var(--primary-hover);
        }
        #image-preview {
            max-width: 200px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }

        /* --- LOGIN & DASHBOARD STYLES --- */
        #login-section {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .login-box {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 { margin-bottom: 1.5rem; color: var(--primary-color); }
        .login-box input {
            width: 100%; padding: 1rem; margin-bottom: 1rem;
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            color: #fff; border-radius: 8px; text-align: center; font-size: 1.2rem;
            letter-spacing: 2px;
        }
        #admin-content {
            display: none;
        }
        
        /* --- PRODUCT TABLE --- */
        .admin-table-wrapper {
            margin-top: 3rem;
            overflow-x: auto;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-color);
        }
        .admin-table th, .admin-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-table th { color: var(--primary-color); font-weight: 600; }
        .admin-table img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .btn-delete {
            background: #e74c3c; color: white; border: none; padding: 0.5rem 1rem;
            border-radius: 6px; cursor: pointer; transition: 0.3s;
        }
        .btn-delete:hover { background: #c0392b; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none; display:flex; align-items:center; gap:0.5rem;"><img src="assets/images/logo.png" alt="Hidayat Teknik" style="height: 40px; width: auto; object-fit: contain; vertical-align: middle;"> <span style="font-weight:700; letter-spacing:1px; font-size:1.2rem;">Hidayat Teknik.</span></a></div>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="katalog.html">Katalog</a></li>
            </ul>
        </div>
    </nav>

    <!-- LOGIN SECTION -->
    <div id="login-section">
        <div class="login-box">
            <h2><i class="fa-solid fa-lock"></i> Login Admin</h2>
            <p style="margin-bottom: 1rem; color: #888;">Masukkan PIN rahasia untuk masuk</p>
            <input type="password" id="admin-pin" placeholder="••••••" maxlength="6">
            <button class="admin-btn" id="btn-login">Masuk</button>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="admin-content">
        <div class="admin-container">
            <div class="admin-header">
                <h2><i class="fa-solid fa-gauge"></i> Dasbor Admin</h2>
                <p>Kelola produk langsung dari browser Anda.</p>
            </div>

            <form id="add-product-form">
                <h3 style="margin-bottom: 1rem; color: var(--primary-color);">Tambah Produk Baru</h3>
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="p-title" required placeholder="Contoh: Terali Jendela Minimalis">
                </div>

                <div class="form-group">
                    <label>Harga (Rupiah)</label>
                    <input type="number" id="p-price" required placeholder="Contoh: 1500000">
                </div>

                <div class="form-group">
                    <label>Kategori</label>
                    <select id="p-category" required>
                        <option value="jendela">Jendela</option>
                        <option value="pintu">Pintu Utama</option>
                        <option value="klasik">Klasik</option>
                        <option value="modern">Modern / Balkon</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Foto Produk (Maks 5MB)</label>
                    <input type="file" id="p-image" accept="image/*" required>
                    <img id="image-preview" src="" alt="Preview">
                </div>

                <button type="submit" class="admin-btn"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Produk</button>
            </form>

            <div class="admin-table-wrapper">
                <h3 style="margin-bottom: 1rem; color: var(--primary-color);">Daftar Produk Aktif</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nama Produk</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>
</body>
</html>
